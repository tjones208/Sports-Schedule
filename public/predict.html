<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prediction Desk</title>
<meta name="description" content="Kalshi sports prediction desk: market edges, position tracking and bankroll management in Mountain time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="theme-color" content="#eaeef3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <div class="wordmark">
      <h1>Prediction Desk</h1>
      <span class="sub">Kalshi sports markets &middot; Mountain time</span>
    </div>
    <nav class="sitenav">
      <a href="index.html">Schedule board</a>
      <a href="predict.html" aria-current="page">Prediction desk</a>
    </nav>
  </div>
</header>

<div class="bankbar">
  <div class="wrap bank-inner" id="bankbar"></div>
</div>

<main class="wrap">
  <div class="notice hidden" id="notice" role="status"></div>

  <div class="controls">
    <div class="leagues" id="tabs">
      <button class="lg" data-tab="edges" aria-pressed="true">Edges</button>
      <button class="lg" data-tab="fpi" aria-pressed="false">FPI strategy <span class="ct" id="fpiCount"></span></button>
      <button class="lg" data-tab="backtest" aria-pressed="false">Backtest</button>
      <button class="lg" data-tab="positions" aria-pressed="false">Positions <span class="ct" id="posCount">0</span></button>
      <button class="lg" data-tab="performance" aria-pressed="false">Performance</button>
      <button class="lg" data-tab="settings" aria-pressed="false">Settings</button>
    </div>
  </div>

  <!-- EDGES -->
  <section id="panel-edges" class="panel">
    <div class="filters">
      <select id="edgeLeague" aria-label="League">
        <option value="nfl">NFL</option>
        <option value="ncaaf">College Football</option>
        <option value="nba">NBA</option>
        <option value="nhl">NHL</option>
        <option value="ncaab">College Basketball</option>
      </select>
      <label class="toggle">Min edge
        <input type="number" id="minEdge" min="0" max="50" step="0.5" value="3" style="width:58px">
        <span>pts</span>
      </label>
      <label class="toggle"><input type="checkbox" id="onlyEdges" checked> Only +EV</label>
      <label class="toggle"><input type="checkbox" id="bothSides"> Both sides</label>
      <label class="toggle" for="edgeFrom">From
        <input type="date" id="edgeFrom" aria-label="Only games on or after this date">
      </label>
      <label class="toggle" for="edgeTo">To
        <input type="date" id="edgeTo" aria-label="Only games on or before this date">
      </label>
      <button class="btn" id="edgeWeek" type="button">Next 7 days</button>
      <label class="toggle" for="edgeSort">Sort
        <select id="edgeSort" aria-label="Sort order">
          <option value="edge">Best edge</option>
          <option value="date">Game date</option>
          <option value="stake">Largest stake</option>
          <option value="price">Cheapest price</option>
        </select>
      </label>
      <button class="btn" id="edgeClear" type="button">Clear dates</button>
      <span class="spacer"></span>
      <button class="btn" id="refresh" type="button">Refresh markets</button>
    </div>
    <div id="edges"></div>
  </section>

  <!-- FPI STRATEGY -->
  <section id="panel-fpi" class="panel" hidden>
    <div class="filters">
      <input type="search" id="fpiSearch" placeholder="Find a team&hellip;" aria-label="Search by team, sport or network" style="min-width:180px">
      <select id="fpiLeague" aria-label="Sport">
        <option value="all">All sports</option>
        <option value="nfl">NFL</option>
        <option value="ncaaf">College Football</option>
        <option value="nba">NBA</option>
        <option value="nhl">NHL</option>
        <option value="ncaab">College Basketball</option>
      </select>
      <label class="toggle" for="fpiDisc">Discount
        <input type="number" id="fpiDisc" min="0" max="40" step="0.1" value="5" style="width:62px"
          aria-label="Points the Kalshi ask must sit below the ESPN FPI price">
        <span>pts</span>
      </label>
      <label class="toggle"><input type="checkbox" id="fpiAddFee"> Add fee on top</label>
      <label class="toggle" for="fpiLow">FPI
        <input type="number" id="fpiLow" min="0" max="100" step="1" value="0" style="width:58px" aria-label="Lower model probability bound, percent">
        <span>&ndash;</span>
        <input type="number" id="fpiHigh" min="0" max="100" step="1" value="100" style="width:58px" aria-label="Upper FPI bound, percent">
        <span>%</span>
      </label>
      <label class="toggle" for="fpiQty">Size
        <input type="number" id="fpiQty" min="1" max="10000" step="1" value="100" style="width:70px" aria-label="Contracts per trade">
        <span>ct</span>
      </label>
      <label class="toggle"><input type="checkbox" id="fpiTrigOnly"> Triggers only</label>
      <label class="toggle"><input type="checkbox" id="fpiQuotedOnly"> Priced only</label>
      <label class="toggle"><input type="checkbox" id="fpiFbs"> FBS only</label>
      <label class="toggle"><input type="checkbox" id="fpiBoth"> Both sides</label>
      <label class="toggle" for="fpiFrom">From <input type="date" id="fpiFrom" aria-label="Only games on or after this date"></label>
      <label class="toggle" for="fpiTo">To <input type="date" id="fpiTo" aria-label="Only games on or before this date"></label>
      <label class="toggle" for="fpiSort">Sort
        <select id="fpiSort" aria-label="Sort order">
          <option value="surplus">Best vs target</option>
          <option value="fpi">Highest FPI</option>
          <option value="date">Game date</option>
          <option value="price">Cheapest ask</option>
          <option value="pnl">Biggest expected P&amp;L</option>
        </select>
      </label>
      <button class="btn" id="fpiReset" type="button">Reset filters</button>
      <span class="spacer"></span>
      <button class="btn primary" id="fpiPrices" type="button"
        title="Re-pull only the Kalshi order books - fast, five requests">Refresh prices</button>
      <button class="btn" id="fpiReload" type="button"
        title="Re-pull everything: schedules, Kalshi books and ESPN projections">Reload all</button>
    </div>
    <div id="fpiOut"></div>
  </section>

  <!-- BACKTEST -->
  <section id="panel-backtest" class="panel" hidden>
    <div class="filters">
      <select id="btLeague" aria-label="Sport">
        <option value="ncaaf">College Football</option>
        <option value="nfl">NFL</option>
        <option value="nba">NBA</option>
        <option value="nhl">NHL</option>
        <option value="ncaab">College Basketball</option>
      </select>
      <select id="btSeason" aria-label="Season"></select>
      <select id="btRange" aria-label="How much of the season to load">
        <option value="probe">Quick probe (first 2 weeks)</option>
        <option value="half">First half</option>
        <option value="full" selected>Full season</option>
      </select>
      <button class="btn primary" id="btLoad" type="button">Load</button>
      <span class="spacer"></span>
      <button class="btn" id="btExport" type="button">Export data</button>
      <button class="btn" id="btForget" type="button">Clear cached seasons</button>
    </div>

    <div class="filters">
      <label class="toggle" for="btLow">FPI
        <input type="number" id="btLow" min="50" max="100" step="1" value="50" style="width:58px" aria-label="Lower FPI bound, percent">
        <span>&ndash;</span>
        <input type="number" id="btHigh" min="50" max="100" step="1" value="100" style="width:58px" aria-label="Upper FPI bound, percent">
        <span>%</span>
      </label>
      <label class="toggle" for="btDisc">Discount
        <input type="number" id="btDisc" min="-10" max="40" step="0.5" value="5" style="width:64px" aria-label="Points below FPI">
        <span>pts</span>
      </label>
      <label class="toggle"><input type="checkbox" id="btAddFee"> Add fee on top</label>
      <label class="toggle" for="btQty">Size
        <input type="number" id="btQty" min="1" max="10000" step="1" value="100" style="width:70px" aria-label="Contracts per game">
        <span>ct</span>
      </label>
      <label class="toggle" for="btRole">Fee
        <select id="btRole" aria-label="Fee role">
          <option value="taker">Taker</option>
          <option value="maker">Maker</option>
        </select>
      </label>
      <label class="toggle" for="btPriceMode">Price
        <select id="btPriceMode" aria-label="Price assumption">
          <option value="fpi">Assume FPI minus discount</option>
          <option value="market">Use real closing line</option>
        </select>
      </label>
      <label class="toggle" for="btSpread">Slippage
        <input type="number" id="btSpread" min="0" max="10" step="0.5" value="0" style="width:58px" aria-label="Slippage in points">
        <span>pts</span>
      </label>
      <button class="btn" id="btReset" type="button">Reset variables</button>
    </div>

    <div id="btOut"></div>
  </section>

  <!-- POSITIONS -->
  <section id="panel-positions" class="panel" hidden>
    <div class="filters">
      <button class="btn" id="addManual" type="button">Log a position manually</button>
      <label class="toggle"><input type="checkbox" id="showSettled"> Show settled</label>
      <span class="spacer"></span>
      <button class="btn" id="markAll" type="button">Refresh marks</button>
    </div>
    <div id="positions"></div>
  </section>

  <!-- PERFORMANCE -->
  <section id="panel-performance" class="panel" hidden>
    <div id="performance"></div>
  </section>

  <!-- SETTINGS -->
  <section id="panel-settings" class="panel" hidden>
    <div class="settings-grid" id="settings"></div>
  </section>
</main>

<footer class="wrap">
  <span>Positions are stored in this browser only &mdash; export regularly to keep a backup.</span>
  <span id="deskGenerated"></span>
</footer>

<!-- Log-position dialog -->
<dialog id="logDialog">
  <form method="dialog" id="logForm">
    <h3 id="logTitle">Log a position</h3>
    <div class="dlg-grid">
      <label>Market ticker<input name="ticker" required placeholder="KXNFLGAME-26SEP13CINTB-CIN"></label>
      <label>Description<input name="title" placeholder="Bengals to beat Buccaneers"></label>
      <label>League
        <select name="league">
          <option value="nfl">NFL</option><option value="ncaaf">College Football</option>
          <option value="nba">NBA</option><option value="nhl">NHL</option>
          <option value="ncaab">College Basketball</option><option value="other">Other</option>
        </select>
      </label>
      <label>Side
        <select name="side"><option value="YES">YES</option><option value="NO">NO</option></select>
      </label>
      <label>Contracts<input name="contracts" type="number" min="1" step="1" value="10" required></label>
      <label>Entry price (cents)<input name="price" type="number" min="1" max="99" step="1" value="50" required></label>
      <label class="dlg-wide">Note<input name="note" placeholder="why you took it"></label>
    </div>
    <p class="dlg-cost" id="dlgCost"></p>
    <menu>
      <button value="cancel" class="btn" type="submit" formnovalidate>Cancel</button>
      <button value="save" class="btn primary" type="submit">Save position</button>
    </menu>
  </form>
</dialog>

<script src="predict.js"></script>
</body>
</html>
